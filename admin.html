<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Snap Showdown</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f5fff7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 20px;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      color: #555;
      margin-bottom: 10px;
    }

    .info-bar button {
      padding: 6px 14px;
      font-size: 0.9em;
      background: #388e3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
    }

    .info-bar button:hover {
      background: #2e7d32;
    }

    .tabs {
      text-align: center;
      margin-bottom: 20px;
    }

    .tab-button {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      border-radius: 20px;
      background: #e1f5e1;
      color: #2e7d32;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-button.active {
      background: #6D9674;
      color: white;
    }

    .search-box {
      text-align: center;
      margin: 20px 0;
    }

    .search-box input {
      padding: 10px;
      width: 80%;
      max-width: 400px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1em;
    }

    .photo-block {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #f9fdf9;
    }

    .photo-block img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 14px;
      background-color: #6D9674;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1F3B2C;
    }

    .undo-button {
      background: #ffcc00;
      color: black;
    }

    @media (max-width: 768px) {
      .tab-button {
        margin: 5px 3px;
        padding: 8px 12px;
      }

      .search-box input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="info-bar">
    <span id="adminEmailInfo">Logged in as: admin</span>
    <div>
      <button onclick="goHome()">Home</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <h2>Photo Submission Admin Panel</h2>

  <div class="tabs">
    <button class="tab-button active" onclick="showTab('pending')">Pending</button>
    <button class="tab-button" onclick="showTab('approved')">Approved</button>
    <button class="tab-button" onclick="showTab('rejected')">Rejected</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search by title or email..." oninput="filterPhotos()" />
  </div>

  <div id="photoContainer"></div>
</div>

<script>
  const photoSubmissions = JSON.parse(localStorage.getItem('photoSubmissions') || '[]');
  let currentTab = 'pending';

  const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
  document.getElementById('adminEmailInfo').textContent = `Logged in as: ${userInfo.email || 'admin'}`;

  function goHome() {
    window.location.href = 'home.html';
  }

  function logout() {
    localStorage.removeItem('userInfo');
    window.location.href = 'login.html';
  }

  function showTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    filterPhotos();
  }

  function filterPhotos() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('photoContainer');
    container.innerHTML = '';

    const filtered = photoSubmissions
      .map((p, i) => ({ ...p, index: i }))
      .filter(p =>
        p.status === currentTab &&
        (p.title.toLowerCase().includes(search) || p.participant.toLowerCase().includes(search))
      );

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center;color:#777;">No submissions found.</p>';
      return;
    }

    filtered.forEach(photo => {
      const block = document.createElement('div');
      block.className = 'photo-block';
      block.innerHTML = `
        <h4>${photo.title}</h4>
        <p><strong>Submitted by:</strong> ${photo.participant}</p>
        <p>${photo.description}</p>
        <img src="${photo.file}" alt="${photo.title}" />
        <div>
          ${photo.status === 'pending' ? `
            <button onclick="approvePhoto(${photo.index})">Approve</button>
            <button onclick="rejectPhoto(${photo.index})">Reject</button>
          ` : `
            <button class="undo-button" onclick="revertPhoto(${photo.index})">Revert to Pending</button>
          `}
        </div>
      `;
      container.appendChild(block);
    });
  }

  function approvePhoto(index) {
    if (!confirm("Approve this photo?")) return;
    photoSubmissions[index].status = 'approved';
    sendNotification(photoSubmissions[index].participant, `✅ Your photo "${photoSubmissions[index].title}" was approved!`);
    localStorage.setItem('photoSubmissions', JSON.stringify(photoSubmissions));
    filterPhotos();
  }

  function rejectPhoto(index) {
    if (!confirm("Reject this photo?")) return;
    photoSubmissions[index].status = 'rejected';
    sendNotification(photoSubmissions[index].participant, `❌ Your photo "${photoSubmissions[index].title}" was rejected.`);
    localStorage.setItem('photoSubmissions', JSON.stringify(photoSubmissions));
    filterPhotos();
  }

  function revertPhoto(index) {
    photoSubmissions[index].status = 'pending';
    localStorage.setItem('photoSubmissions', JSON.stringify(photoSubmissions));
    filterPhotos();
  }

  function sendNotification(email, message) {
    const allNotifications = JSON.parse(localStorage.getItem('userNotifications') || '{}');
    const time = new Date().toLocaleString();
    if (!allNotifications[email]) allNotifications[email] = [];
    allNotifications[email].unshift({ message, time });
    localStorage.setItem('userNotifications', JSON.stringify(allNotifications));
  }

  // Initial render
  filterPhotos();
</script>

</body>
</html>
